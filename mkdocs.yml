site_name: AUV 培訓手冊 (2026)
site_url: https://hereyougoai.github.io/auv-training-2026/
theme:
  name: material
  font:
    text: Noto Sans TC      # 網頁主要文字字體 (自動載入 Google Fonts)
    code: JetBrains Mono    # 程式碼區塊專用等寬字體
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 首頁: index.md
  - 階段一：環境建置: stage1_env/index.md
  - 階段二：Linux & Git: stage2_collab/index.md
  - 階段三：Python & Docker: stage3_sandbox/index.md
  - 階段四：ROS 2: stage4_ros2/index.md
  - 階段五：視覺辨識: stage5_vision/index.md
  - 階段六：整合專案: stage6_integration/index.md

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  # 1. 提示與摺疊區塊 (強烈建議)
  - admonition
  - pymdownx.details
  
  # 2. 多環境標籤頁切換
  - pymdownx.tabbed:
      alternate_style: true
      
  # 3. 程式碼高亮強化
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  
  # 4. 培訓專用任務清單
  - pymdownx.tasklist:
      custom_checkbox: true
      
  # 5. 數學公式支援 (演算法必備)
  - pymdownx.arithmatex:
      generic: true

